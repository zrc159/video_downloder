name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:    # 允许你在 Actions 页面手动触发

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp customtkinter pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --windowed --name YouTubeDownloader `
            --collect-all yt_dlp `
            --collect-all customtkinter `
            YouTubeDownLoad.py

      - name: Copy ffmpeg and ffprobe
        run: |
          copy ffmpeg.exe dist\YouTubeDownloader\
          copy ffprobe.exe dist\YouTubeDownloader\

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: YouTubeDownloader-Windows
          path: dist\YouTubeDownloader\
